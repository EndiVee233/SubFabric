# SubFabric CI —— 把"能自动发现的错误"挡在 main 之外。
#
# 为什么加它（第二轮/第三轮审查的共同结论）：
#   · 无 CI 时，"合并引入的回归""行尾符导致的假失败""ESLint 配置漏检"这类问题
#     只能靠人偶然发现 —— 而它们全都能被机器秒查出来。
#   · 本工作流刻意只跑**不需要 GPU / 模型 / 网络**的部分，保证在任何机器上都能通过。
#
# 三条防线：
#   ① ESLint —— no-undef（用了不存在的变量）是本项目最容易出真 bug 的一类；
#   ② 全量测试 —— tests/run-all.mjs（内部会先跑 gen-fixture 生成夹具）；
#   ③ ruff —— Python 侧的同款静态检查。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支连续推送时取消旧的一次，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS · ESLint + 全量测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 是硬要求：项目靠 require(esm) 让"一份 ESM 双端复用"的模块
      # 既能被浏览器 import、又能被 server.js require。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 项目没有 package.json（无构建步骤），所以用 npx 现拉 eslint@9；
      # 仓库根的 eslint.config.js 是 flat config，会被自动读取。
      - name: ESLint
        run: npx --yes eslint@9 editor/ tools/ tests/

      - name: 全量测试
        run: node tests/run-all.mjs

      - name: 全主题实际渲染检查
        env:
          SUBFABRIC_BROWSER: /usr/bin/google-chrome
        run: node tools/theme-visual-test.mjs --out _test/theme-visual

      - name: 主题覆盖矩阵与截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-visual
          path: _test/theme-visual/
          if-no-files-found: ignore
          retention-days: 14

  py:
    name: Python · ruff + 单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        # numpy 是 asr/confidence.py 的硬依赖（本测试组要 import 它）。
        # 刻意**不装** sherpa-onnx / openvino：那两样是推理运行时，
        # 本 job 只跑不需要模型与加速卡的纯逻辑测试。
        run: pip install ruff numpy
      - name: ruff check
        run: ruff check .
      - name: Python 单测
        # 这里**逐个列名**而不是 `for t in tests/*-test.py`：
        # tests/ 下还有一批需要本机样本 / CUDA / 生成器的脚本
        # （cuda-confidence-smoke、diag-*、calibrate-confidence、make-noisy-samples…），
        # 在 CI 上必然失败。下面是可移植测试全集；新增纯逻辑测试时同步补入。
        run: |
          set -e
          for t in confidence-test draft-role-gap-test fetch-format-test \
                   glommed-split-test frame-units-test asr-segment-parity-test \
                   vibevoice-worker-test diarize-wav-test parent-watch-test \
                   fetch-boundary-test; do
            echo "───────── tests/$t.py ─────────"
            python "tests/$t.py"
          done
